[project]
name = "mcp-tutorial"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "ShubhamAbhayDeshpande", email = "deshpandeaa6@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "black>=26.10.1",
    "ruff>=0.17.6",
]

[project.scripts]
mcp-tutorial = "mcp_tutorial:main"

[build-system]
requires = ["uv_build>=0.13.8,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mcp[cli]>=2.3.0",
    "numpy>=2.5.5",
    "pytest>=9.2.0",
]
[tool.ruff]
line-length = 79

[tool.ruff.lint]
select = ["E", "W", "F"]   # E501 = line too long
